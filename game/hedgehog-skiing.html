<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hedgehog Freeride Skiing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #FFFFFF 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #highScore {
            font-size: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-top: 5px;
        }

        #speed {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            pointer-events: all;
        }

        #menu h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #333;
        }

        #menu p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #666;
        }

        .button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            pointer-events: all;
        }

        .button:active {
            transform: scale(0.95);
        }

        #gameOver {
            display: none;
        }

        #gameOver h2 {
            font-size: 48px;
            color: #f44336;
            margin-bottom: 20px;
        }

        #finalScore {
            font-size: 32px;
            margin-bottom: 30px;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        #instructions {
            font-size: 16px;
            color: #666;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="highScore">Best: 0</div>
            <div id="speed">Speed: 0</div>
        </div>

        <div id="menu">
            <h1>🎿 Hedgehog Skiing 🎿</h1>
            <p>Downhill Freeride Adventure!</p>
            <button class="button" onclick="startGame()">START GAME</button>
            <div id="instructions">
                <strong>How to Play:</strong><br>
                Tap left or right side of screen to steer<br>
                Avoid trees and rocks!<br>
                Collect snowflakes for bonus points!
            </div>
        </div>

        <div id="menu" id="gameOver" class="hidden">
            <h2>Game Over!</h2>
            <div id="finalScore">Score: 0</div>
            <button class="button" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

        let player = {
            x: 0,
            y: 0,
            width: 60,
            height: 60,
            rotation: 0,
            targetX: 0
        };
        
        let obstacles = [];
        let snowflakes = [];
        let trees = [];
        let terrainOffset = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height * 0.3;
            player.targetX = player.x;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('click', handleClick);
        
        function handleTouch(e) {
            e.preventDefault();
            if (gameState !== 'playing') return;
            
            const touch = e.touches[0] || e.changedTouches[0];
            const x = touch.clientX;
            
            if (x < canvas.width / 2) {
                player.targetX = Math.max(player.width / 2, player.targetX - 30);
            } else {
                player.targetX = Math.min(canvas.width - player.width / 2, player.targetX + 30);
            }
        }
        
        function handleClick(e) {
            if (gameState !== 'playing') return;
            
            const x = e.clientX;
            if (x < canvas.width / 2) {
                player.targetX = Math.max(player.width / 2, player.targetX - 30);
            } else {
                player.targetX = Math.min(canvas.width - player.width / 2, player.targetX + 30);
            }
        }
        
        function startGame() {
            document.getElementById('menu').classList.add('hidden');
            document.querySelectorAll('#menu')[1].classList.add('hidden');
            gameState = 'playing';
            score = 0;
            speed = baseSpeed;
            obstacles = [];
            snowflakes = [];
            trees = [];
            terrainOffset = 0;
            player.x = canvas.width / 2;
            player.targetX = player.x;
            player.rotation = 0;
            
            for (let i = 0; i < 5; i++) {
                spawnObstacle();
                spawnSnowflake();
            }
            
            gameLoop();
        }
        
        function restartGame() {
            startGame();
        }
        
        function spawnObstacle() {
            const types = ['tree', 'rock'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            obstacles.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: canvas.height + Math.random() * 200,
                width: type === 'tree' ? 50 : 40,
                height: type === 'tree' ? 80 : 35,
                type: type
            });
        }
        
        function spawnSnowflake() {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 100,
                size: Math.random() * 8 + 4,
                collected: false
            });
        }
        
        function drawSnow() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() * canvas.width + terrainOffset * 0.5) % canvas.width;
                const y = (terrainOffset * 2 + i * 20) % canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawTerrain() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = 2;
            
            for (let i = -1; i < 20; i++) {
                const y = (i * 100 + terrainOffset) % (canvas.height + 200);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            drawSnow();
        }
        
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            
            if (hedgehogImg.complete) {
                ctx.drawImage(hedgehogImg, -player.width / 2, -player.height / 2, player.width, player.height);
            } else {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(0, 0, player.width / 2, player.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawObstacles() {
            obstacles.forEach(obs => {
                if (obs.type === 'tree') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(obs.x - 10, obs.y, 20, obs.height);
                    
                    ctx.fillStyle = '#228B22';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y - 20);
                    ctx.lineTo(obs.x - 25, obs.y + 30);
                    ctx.lineTo(obs.x + 25, obs.y + 30);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x - 20, obs.y + 20);
                    ctx.lineTo(obs.x + 20, obs.y + 20);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.ellipse(obs.x, obs.y + obs.height / 2, obs.width / 2, obs.height / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#A0A0A0';
                    ctx.beginPath();
                    ctx.arc(obs.x - 8, obs.y + 5, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawSnowflakes() {
            ctx.fillStyle = '#FFD700';
            snowflakes.forEach(flake => {
                if (!flake.collected) {
                    ctx.save();
                    ctx.translate(flake.x, flake.y);
                    ctx.rotate((Date.now() / 200) % (Math.PI * 2));
                    
                    for (let i = 0; i < 6; i++) {
                        ctx.rotate(Math.PI / 3);
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(0, flake.size);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#FFD700';
                        ctx.stroke();
                    }
                    
                    ctx.restore();
                }
            });
        }
        
        function updateGame() {
            if (gameState !== 'playing') return;
            
            speed = Math.min(baseSpeed + score * 0.001, 15);
            score += Math.floor(speed);
            terrainOffset += speed;
            
            const dx = player.targetX - player.x;
            player.x += dx * 0.15;
            player.rotation = dx * 0.003;
            
            obstacles.forEach(obs => {
                obs.y -= speed;
            });
            
            obstacles = obstacles.filter(obs => obs.y > -obs.height - 100);
            
            while (obstacles.length < 8) {
                spawnObstacle();
            }
            
            snowflakes.forEach(flake => {
                flake.y -= speed;
            });
            
            snowflakes = snowflakes.filter(flake => !flake.collected && flake.y > -20);
            
            while (snowflakes.length < 5) {
                spawnSnowflake();
            }
            
            obstacles.forEach(obs => {
                const dist = Math.hypot(player.x - obs.x, player.y - obs.y);
                if (dist < (player.width + obs.width) / 2) {
                    gameOver();
                }
            });
            
            snowflakes.forEach(flake => {
                if (!flake.collected) {
                    const dist = Math.hypot(player.x - flake.x, player.y - flake.y);
                    if (dist < player.width / 2 + flake.size) {
                        flake.collected = true;
                        score += 100;
                    }
                }
            });
        }
        
        function drawUI() {
            document.getElementById('score').textContent = `Score: ${Math.floor(score)}`;
            document.getElementById('highScore').textContent = `Best: ${Math.floor(highScore)}`;
            document.getElementById('speed').textContent = `${Math.floor(speed * 10)} km/h`;
        }
        
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('hedgehogSkiHighScore', Math.floor(highScore));
            }
            
            const gameOverMenu = document.querySelectorAll('#menu')[1];
            gameOverMenu.classList.remove('hidden');
            document.getElementById('finalScore').textContent = `Score: ${Math.floor(score)}`;
        }
        
        function gameLoop() {
            if (gameState === 'playing') {
                updateGame();
            }
            
            drawTerrain();
            drawObstacles();
            drawSnowflakes();
            drawPlayer();
            drawUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('highScore').textContent = `Best: ${Math.floor(highScore)}`;
    </script>
