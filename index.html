<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hedgehog Freeride Skiing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #FFFFFF 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #highScore {
            font-size: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-top: 5px;
        }

        #speed {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            pointer-events: all;
        }

        #menu h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #333;
        }

        #menu p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #666;
        }

        .button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            pointer-events: all;
        }

        .button:active {
            transform: scale(0.95);
        }

        #gameOver {
            display: none;
        }

        #gameOver h2 {
            font-size: 48px;
            color: #f44336;
            margin-bottom: 20px;
        }

        #finalScore {
            font-size: 32px;
            margin-bottom: 30px;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        #instructions {
            font-size: 16px;
            color: #666;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="highScore">Best: 0</div>
            <div id="speed">Speed: 0</div>
        </div>

        <div id="menu">
            <h1>🎿 Hedgehog Skiing 🎿</h1>
            <p>Downhill Freeride Adventure!</p>
            <button class="button" onclick="startGame()">START GAME</button>
            <div id="instructions">
                <strong>How to Play:</strong><br>
                Tap LEFT to steer left, RIGHT to steer right<br>
                Tap MIDDLE to JUMP over rocks!<br>
                Longer air = bigger bonus. Trees can't be jumped!
            </div>
        </div>

        <div id="menu" id="gameOver" class="hidden">
            <h2>Game Over!</h2>
            <div id="finalScore">Score: 0</div>
            <button class="button" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'menu';
        let score = 0;
        let highScore = localStorage.getItem('hedgehogSkiHighScore') || 0;
        let speed = 0;
        const INITIAL_BASE_SPEED = 1.5;
        let baseSpeed = INITIAL_BASE_SPEED;
        // Per-frame speed gain. At 60fps this passes the old 80 km/h ceiling around
        // the one minute mark and keeps accelerating from there.
        let acceleration = 0.002;
        let runFrames = 0;
        let gameLoopStarted = false;
        
        const ROCK_CLEAR_HEIGHT = 30;
        // How much bigger the sprite renders at the apex. The lift cap subtracts the
        // scaled half-height so a big air can't clip off the top of the canvas.
        const AIR_SCALE_BONUS = 0.45;
        
        // Airborne state is tracked as altitude above the slope rather than a raw
        // screen position, so the hedgehog can never be launched off the canvas.
        let player = {
            x: 0,
            y: 0,
            baseY: 0,
            width: 70,
            height: 70,
            rotation: 0,
            targetX: 0,
            airHeight: 0,
            airVelocity: 0,
            isJumping: false,
            jumpImpulse: 26,
            gravity: 0.8,
            spin: 0,
            airTime: 0,
            maxLift: 0
        };
        
        // Apex of a full jump, used to map altitude onto the on-screen arc so the
        // sprite sweeps its whole travel instead of pinning at the top.
        player.peakHeight = (player.jumpImpulse * player.jumpImpulse) / (2 * player.gravity);
        
        function altitudeRatio() {
            return Math.min(player.airHeight / player.peakHeight, 1);
        }
        
        // Declared after the player so the decode callback can safely size the
        // sprite no matter when the browser fires it.
        const hedgehogImg = new Image();
        // Only ever draw a sprite the browser has fully decoded. A partially decoded
        // image makes drawImage throw, which would take the whole game loop down.
        let spriteReady = false;
        hedgehogImg.onload = () => {
            spriteReady = true;
            // Draw at the sprite's own aspect ratio so the hedgehog is never squashed.
            player.height = player.width * (hedgehogImg.naturalHeight / hedgehogImg.naturalWidth);
            updateLiftCap();
        };

        let obstacles = [];
        let snowflakes = [];
        let trees = [];
        let particles = [];
        let popups = [];
        let terrainOffset = 0;
        let shake = 0;
        let spawnCursorY = 0;
        
        const MIN_OBSTACLE_GAP = 210;
        const OBSTACLE_GAP_RANGE = 200;
        function updateLiftCap() {
            const apexHalfHeight = (player.height * (1 + AIR_SCALE_BONUS)) / 2;
            player.maxLift = Math.max(0, player.baseY - apexHalfHeight - 8);
        }
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height * 0.34;
            player.baseY = canvas.height * 0.34;
            player.targetX = player.x;
            updateLiftCap();
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('click', handleClick);
        
        function handleTouch(e) {
            e.preventDefault();
            if (gameState !== 'playing') return;
            
            const touch = e.touches[0] || e.changedTouches[0];
            const x = touch.clientX;
            const screenThird = canvas.width / 3;
            
            if (x < screenThird) {
                // Left side - steer left
                player.targetX = Math.max(player.width / 2, player.targetX - 40);
            } else if (x > screenThird * 2) {
                // Right side - steer right
                player.targetX = Math.min(canvas.width - player.width / 2, player.targetX + 40);
            } else {
                startJump();
            }
        }
        
        function handleClick(e) {
            if (gameState !== 'playing') return;
            
            const x = e.clientX;
            const screenThird = canvas.width / 3;
            
            if (x < screenThird) {
                player.targetX = Math.max(player.width / 2, player.targetX - 40);
            } else if (x > screenThird * 2) {
                player.targetX = Math.min(canvas.width - player.width / 2, player.targetX + 40);
            } else {
                startJump();
            }
        }
        
        function startJump() {
            if (player.isJumping) return;
            
            player.isJumping = true;
            player.airVelocity = player.jumpImpulse;
            player.airTime = 0;
            player.spin = 0;
            spawnSpray(18, 1.2);
        }
        
        function spawnSpray(count, force) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: player.x + (Math.random() - 0.5) * player.width,
                    y: player.baseY + player.height / 3,
                    vx: (Math.random() - 0.5) * 6 * force,
                    vy: (Math.random() * -3 - 1) * force,
                    size: Math.random() * 4 + 2,
                    life: 1
                });
            }
        }
        
        function addPopup(text, color) {
            popups.push({
                x: player.x,
                y: player.y - player.height,
                text: text,
                color: color,
                life: 1
            });
        }
        
        function land() {
            const airTime = player.airTime;
            
            player.isJumping = false;
            player.airHeight = 0;
            player.airVelocity = 0;
            player.spin = 0;
            player.airTime = 0;
            
            spawnSpray(26, 1.8);
            shake = Math.min(14, airTime * 0.35);
            
            const bonus = airTime * 8;
            score += bonus;
            
            if (airTime > 55) {
                addPopup('MASSIVE AIR! +' + bonus, '#e74c3c');
            } else if (airTime > 35) {
                addPopup('BIG AIR! +' + bonus, '#f39c12');
            } else {
                addPopup('+' + bonus, '#2c3e50');
            }
        }
        
        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy - speed * 0.4;
                p.vy += 0.25;
                p.life -= 0.03;
            });
            particles = particles.filter(p => p.life > 0);
        }
        
        function updatePopups() {
            popups.forEach(p => {
                p.y -= 1.4;
                p.life -= 0.02;
            });
            popups = popups.filter(p => p.life > 0);
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function drawPopups() {
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px -apple-system, sans-serif';
            popups.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.strokeText(p.text, p.x, p.y);
                ctx.fillStyle = p.color;
                ctx.fillText(p.text, p.x, p.y);
            });
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }
        
        function startGame() {
            document.getElementById('menu').classList.add('hidden');
            document.querySelectorAll('#menu')[1].classList.add('hidden');
            gameState = 'playing';
            score = 0;
            speed = INITIAL_BASE_SPEED;
            baseSpeed = INITIAL_BASE_SPEED;
            runFrames = 0;
            obstacles = [];
            snowflakes = [];
            trees = [];
            particles = [];
            popups = [];
            terrainOffset = 0;
            shake = 0;
            player.x = canvas.width / 2;
            player.y = player.baseY;
            player.targetX = player.x;
            player.rotation = 0;
            player.airHeight = 0;
            player.airVelocity = 0;
            player.airTime = 0;
            player.spin = 0;
            player.isJumping = false;
            
            // Start the field below the fold so a run always opens with clear slope.
            spawnCursorY = canvas.height + 120;
            
            for (let i = 0; i < 4; i++) {
                spawnObstacle();
                spawnSnowflake();
            }
            
            if (!gameLoopStarted) {
                gameLoopStarted = true;
                gameLoop();
            }
        }
        
        function restartGame() {
            startGame();
        }
        
        // Obstacles are placed along a downhill cursor rather than at random depths,
        // which keeps their arrival readable and lets us guarantee a passable lane.
        function spawnObstacle() {
            const type = Math.random() < 0.5 ? 'tree' : 'rock';
            const width = type === 'tree' ? 50 : 40;
            const height = type === 'tree' ? 80 : 35;
            const margin = width / 2 + 8;
            const laneWidth = player.width + 30;
            
            let x = margin + Math.random() * Math.max(1, canvas.width - margin * 2);
            
            for (let attempt = 0; attempt < 15; attempt++) {
                const crowded = obstacles.some(o =>
                    Math.abs(o.y - spawnCursorY) < 160 &&
                    Math.abs(o.x - x) < laneWidth
                );
                if (!crowded) break;
                x = margin + Math.random() * Math.max(1, canvas.width - margin * 2);
            }
            
            obstacles.push({
                x: x, y: spawnCursorY, prevY: spawnCursorY,
                width: width, height: height, type: type
            });
            spawnCursorY += MIN_OBSTACLE_GAP + Math.random() * OBSTACLE_GAP_RANGE;
        }
        
        function spawnSnowflake() {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 100,
                size: Math.random() * 8 + 4,
                collected: false
            });
        }
        
        function drawSnow() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() * canvas.width + terrainOffset * 0.5) % canvas.width;
                const y = (terrainOffset * 2 + i * 20) % canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawTerrain() {
            ctx.fillStyle = '#FFFFFF';
            // Oversized so the landing shake never exposes an unpainted edge.
            ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
            
            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = 2;
            
            for (let i = -1; i < 20; i++) {
                const y = (i * 100 + terrainOffset) % (canvas.height + 200);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            drawSnow();
        }
        
        function drawPlayer() {
            // Altitude drives both the shadow gap and the sprite scale, which reads
            // as height without ever moving the sprite off the canvas.
            const altitude = altitudeRatio();
            
            ctx.fillStyle = `rgba(0, 0, 0, ${0.3 - altitude * 0.18})`;
            ctx.beginPath();
            ctx.ellipse(player.x, player.baseY + player.height / 2,
                       (player.width / 2) * (1 - altitude * 0.5),
                       (player.height / 5) * (1 - altitude * 0.5),
                       0, 0, Math.PI * 2);
            ctx.fill();
            
            if (player.isJumping) {
                drawAirLines(altitude);
            }
            
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(1 + altitude * AIR_SCALE_BONUS, 1 + altitude * AIR_SCALE_BONUS);
            ctx.rotate(player.isJumping ? player.spin : player.rotation);
            
            if (spriteReady) {
                ctx.drawImage(hedgehogImg, 
                    -player.width / 2, 
                    -player.height / 2, 
                    player.width, 
                    player.height);
            } else {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(0, 0, player.width / 2, player.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawAirLines(altitude) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + altitude * 0.45})`;
            ctx.lineWidth = 3;
            for (let i = -1; i <= 1; i++) {
                const x = player.x + i * (player.width * 0.55);
                ctx.beginPath();
                ctx.moveTo(x, player.y + player.height * 0.7);
                ctx.lineTo(x, player.y + player.height * 0.7 + 20 + altitude * 45);
                ctx.stroke();
            }
        }
        
        function drawObstacles() {
            obstacles.forEach(obs => {
                // Draw shadow (3D effect)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.beginPath();
                if (obs.type === 'tree') {
                    ctx.ellipse(obs.x, obs.y + obs.height + 5, 15, 5, 0, 0, Math.PI * 2);
                } else {
                    ctx.ellipse(obs.x, obs.y + obs.height + 3, obs.width / 2 + 5, 8, 0, 0, Math.PI * 2);
                }
                ctx.fill();
                
                if (obs.type === 'tree') {
                    // Tree trunk with gradient
                    const trunkGrad = ctx.createLinearGradient(obs.x - 10, obs.y, obs.x + 10, obs.y);
                    trunkGrad.addColorStop(0, '#654321');
                    trunkGrad.addColorStop(0.5, '#8B4513');
                    trunkGrad.addColorStop(1, '#654321');
                    ctx.fillStyle = trunkGrad;
                    ctx.fillRect(obs.x - 10, obs.y, 20, obs.height);
                    
                    // Tree foliage with 3D effect
                    const foliageGrad = ctx.createRadialGradient(obs.x, obs.y, 5, obs.x, obs.y, 30);
                    foliageGrad.addColorStop(0, '#2ecc71');
                    foliageGrad.addColorStop(1, '#196f3d');
                    ctx.fillStyle = foliageGrad;
                    
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y - 20);
                    ctx.lineTo(obs.x - 25, obs.y + 30);
                    ctx.lineTo(obs.x + 25, obs.y + 30);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.fillStyle = '#229954';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x - 20, obs.y + 20);
                    ctx.lineTo(obs.x + 20, obs.y + 20);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Rock with 3D gradient
                    const rockGrad = ctx.createRadialGradient(obs.x - 10, obs.y, 5, obs.x, obs.y + obs.height / 2, obs.width / 2);
                    rockGrad.addColorStop(0, '#95a5a6');
                    rockGrad.addColorStop(0.7, '#7f8c8d');
                    rockGrad.addColorStop(1, '#5d6d7e');
                    ctx.fillStyle = rockGrad;
                    ctx.beginPath();
                    ctx.ellipse(obs.x, obs.y + obs.height / 2, obs.width / 2, obs.height / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Highlight
                    ctx.fillStyle = '#bdc3c7';
                    ctx.beginPath();
                    ctx.arc(obs.x - 8, obs.y + 5, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawSnowflakes() {
            ctx.fillStyle = '#FFD700';
            snowflakes.forEach(flake => {
                if (!flake.collected) {
                    ctx.save();
                    ctx.translate(flake.x, flake.y);
                    ctx.rotate((Date.now() / 200) % (Math.PI * 2));
                    
                    for (let i = 0; i < 6; i++) {
                        ctx.rotate(Math.PI / 3);
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(0, flake.size);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#FFD700';
                        ctx.stroke();
                    }
                    
                    ctx.restore();
                }
            });
        }
        
        function updateGame() {
            if (gameState !== 'playing') return;
            
            // Speed climbs for as long as the run lasts, with no ceiling. Tying the
            // ramp to elapsed frames rather than score keeps the climb steady
            // instead of compounding, since score itself grows with speed.
            runFrames++;
            speed = baseSpeed + runFrames * acceleration;
            score += Math.floor(speed * 0.5);
            terrainOffset += speed;
            
            // Airborne physics: altitude climbs freely, but the drawn position is
            // clamped to maxLift so the hedgehog always stays on screen.
            if (player.isJumping) {
                player.airVelocity -= player.gravity;
                player.airHeight += player.airVelocity;
                player.airTime++;
                player.spin += 0.09;
                
                if (player.airHeight <= 0) {
                    land();
                }
            }
            
            player.y = player.baseY - altitudeRatio() * player.maxLift;
            
            const dx = player.targetX - player.x;
            player.x += dx * 0.15;
            player.rotation = dx * 0.002;
            
            updateParticles();
            updatePopups();
            
            if (shake > 0) shake *= 0.85;
            
            obstacles.forEach(obs => {
                obs.prevY = obs.y;
                obs.y -= speed;
            });
            
            // The hit zone is measured on the slope (baseY) rather than at the drawn
            // position, so altitude is what clears a rock and a tree stays lethal
            // no matter how high the jump goes. This runs before the off-screen
            // cleanup below: at high speed one frame can carry an obstacle from
            // in front of the hedgehog to past the top of the screen, and checking
            // afterwards would discard the very obstacle that just hit.
            obstacles.forEach(obs => {
                const horizontalGap = Math.abs(player.x - obs.x);
                if (horizontalGap >= (player.width + obs.width) / 2.5) return;
                
                // Sweep the obstacle's travel across the hit zone. Since speed is
                // uncapped, a fast obstacle can cover the whole zone within a single
                // frame, and testing only its current position would let it pass
                // straight through the hedgehog.
                const reach = (player.height + obs.height) / 4;
                const centreNow = obs.y + obs.height / 2;
                const centreBefore = obs.prevY + obs.height / 2;
                
                if (Math.min(centreNow, centreBefore) <= player.baseY + reach &&
                    Math.max(centreNow, centreBefore) >= player.baseY - reach) {
                    if (obs.type === 'tree' || player.airHeight < ROCK_CLEAR_HEIGHT) {
                        gameOver();
                    }
                }
            });
            
            obstacles = obstacles.filter(obs => obs.y > -obs.height - 100);
            
            spawnCursorY -= speed;
            while (spawnCursorY < canvas.height + 260) {
                spawnObstacle();
            }
            
            snowflakes.forEach(flake => {
                flake.y -= speed;
            });
            
            snowflakes = snowflakes.filter(flake => !flake.collected && flake.y > -20);
            
            while (snowflakes.length < 5) {
                spawnSnowflake();
            }
            
            snowflakes.forEach(flake => {
                if (!flake.collected) {
                    const dist = Math.hypot(player.x - flake.x, player.y - flake.y);
                    if (dist < player.width / 2 + flake.size) {
                        flake.collected = true;
                        score += 100;
                    }
                }
            });
        }
        
        function drawUI() {
            document.getElementById('score').textContent = `Score: ${Math.floor(score)}`;
            document.getElementById('highScore').textContent = `Best: ${Math.floor(highScore)}`;
            document.getElementById('speed').textContent = `${Math.floor(speed * 10)} km/h`;
        }
        
        function gameOver() {
            gameState = 'gameover';
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('hedgehogSkiHighScore', Math.floor(highScore));
            }
            
            const gameOverMenu = document.querySelectorAll('#menu')[1];
            gameOverMenu.classList.remove('hidden');
            document.getElementById('finalScore').textContent = `Score: ${Math.floor(score)}`;
        }
        
        function gameLoop() {
            if (gameState === 'playing') {
                updateGame();
            }
            
            ctx.save();
            if (shake > 0.5) {
                ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            }
            
            drawTerrain();
            drawObstacles();
            drawSnowflakes();
            drawParticles();
            drawPlayer();
            drawPopups();
            
            ctx.restore();
            drawUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('highScore').textContent = `Best: ${Math.floor(highScore)}`;
    </script>
</body>
</html>
